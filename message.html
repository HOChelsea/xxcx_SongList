<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="format-detection" content="telephone=no" />

	<title>小小抽象的留言板</title>
	<meta name="description" content="看看大家都留下了什么话" />

	<meta property="og:title" content="小小抽象的留言板" />
	<meta property="og:description" content="看看大家都留下了什么话" />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://hongaman.github.io/Website_design/message.html" />
	<meta property="og:image" content="https://hongaman.github.io/Website_design/cover.png" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
	
	<script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
	<script defer src="message.js"></script>
</head>
<body>
	<div class="background-grid" aria-hidden="true"></div>

	<main class="page">
		<section class="profile-card">
			<div class="profile-main">
				<img class="avatar" src="./icon/icon_.png" alt="个人头像" />
				<div class="profile-text">
					<h1>小小抽象</h1>
					<p class="bio">相逢即是缘！</p>
				</div>
			</div>
			<nav class="platform-links" aria-label="页面导航与音乐平台跳转">
				<a href="https://space.bilibili.com/3546934367226554?spm_id_from=333.337.0.0" target="_blank" rel="noopener noreferrer">bilibili: 每晚10点到凌晨2点</a>
				<a href="https://www.missevan.com/30690288/" target="_blank" rel="noopener noreferrer">貓耳： 每晚凌晨2点到精疲力尽</a>
			</nav>
		</section>

		<section class="playlist-panel">
			<div class="panel-header message-panel-header">
				<div class="title-row">
					<h2>留言板</h2>
				</div>
				<p class="message-panel-intro">那年那月 我们发生了什么故事？</p>
			</div>

			<div id="messageList" class="message-list" aria-live="polite"></div>

			<p id="emptyState" class="empty-state" hidden>暂时还没有留言。</p>
		</section>
	</main>

	<button id="contactBubble" class="contact-bubble" type="button" aria-haspopup="dialog" aria-controls="contactModal">
    给我留言吧！
  </button>

  <dialog id="contactModal" class="contact-modal" aria-labelledby="contactTitle">
    <div class="modal-head">
      <h3 id="contactTitle">留言信箱</h3>
      <button id="closeContactModalBtn" class="close-modal" type="button" aria-label="关闭">×</button>
    </div>

    <p class="modal-tip">今天发生什么好玩的事情吗？<br>让我们一起撰写我们共同的日记吧。</p>

    <form id="contactForm" class="contact-form" novalidate>
      <label class="contact-label" for="contactNameInput">怎么称呼你呀？</label>
      <input id="contactNameInput" class="contact-input" type="text" name="name" placeholder="請輸入你的名字(选填)" maxlength="40" autocomplete="name" />

      <label class="contact-label" for="contactMessageInput">想說的話 想记的事</label>
      <textarea id="contactMessageInput" class="contact-textarea" name="message" placeholder="把想說的告訴我吧" rows="5" maxlength="1000" required></textarea>

      <div class="contact-actions">
        <button id="contactSubmitBtn" class="contact-submit-btn" type="submit">提交留言</button>
      </div>
    </form>

    <p id="contactSuccessTip" class="contact-success-tip" role="status" aria-live="polite" hidden>提交成功，審核中</p>
  </dialog>


	<a class="home-bubble" href="index.html" aria-label="返回主页">返回主页</a>
</body>
</html>
